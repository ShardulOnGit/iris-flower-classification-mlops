services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: iris-mlops-api:latest
    container_name: iris-fastapi-service
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - MODEL_PATH=models/random_forest_model.joblib
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  mlflow-ui:
    image: python:3.11-slim
    container_name: iris-mlflow-ui
    working_dir: /mlflow
    command: >
      sh -c "pip install --no-cache-dir mlflow &&
             mlflow ui --backend-store-uri sqlite:////mlflow/mlflow.db --host 0.0.0.0 --port 5000"
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow.db:/mlflow/mlflow.db
      - ./mlruns:/mlflow/mlruns
      - ./mlartifacts:/mlflow/mlartifacts
    restart: unless-stopped
