[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "iris-flower-classification-mlops"
version = "0.1.0"
description = "End-to-End Iris Flower Classification using MLOps (DVC, MLflow, FastAPI, Docker, Pytest, GitHub Actions)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "scikit-learn>=1.4.0",
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "joblib>=1.3.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "mlflow>=2.10.0",
    "dvc>=3.40.0",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "matplotlib>=3.8.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --tb=short"
testpaths = [
    "tests",
]
pythonpath = [
    "."
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
