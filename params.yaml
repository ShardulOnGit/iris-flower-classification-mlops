base:
  project_name: "Iris-Flower-Classification-MLOps"
  random_state: 42

data_load:
  raw_data_path: "data/raw/iris.csv"

preprocess:
  test_size: 0.2
  stratify: true
  train_data_path: "data/processed/train.csv"
  test_data_path: "data/processed/test.csv"
  features:
    - "sepal_length"
    - "sepal_width"
    - "petal_length"
    - "petal_width"
  target: "target"

train:
  model_dir: "models"
  model_path: "models/random_forest_model.joblib"
  n_estimators: 100
  max_depth: 4
  min_samples_split: 2
  criterion: "gini"
  random_state: 42

evaluate:
  metrics_path: "metrics/scores.json"
  confusion_matrix_path: "metrics/confusion_matrix.png"

mlflow:
  tracking_uri: "sqlite:///mlflow.db"
  experiment_name: "iris-classification-rf"
